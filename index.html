<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>P2P 3D Room</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏠</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #111; color: white; }
      #root { width: 100%; height: 100%; }
      /* Simple loading spinner */
      .loader { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; }
      @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      .init-loader { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; font-family: sans-serif; pointer-events: none; z-index: 9999; }
    </style>
  <script>
    window.onerror = function(msg, url, line, col, error) {
      console.error("Global Error:", msg, url, line, error);
      const div = document.createElement('div');
      div.style.position = 'absolute'; div.style.top = '0'; div.style.left = '0'; 
      div.style.background = 'rgba(255,0,0,0.9)'; div.style.color = 'white'; 
      div.style.padding = '20px'; div.style.zIndex = '10000'; div.style.fontSize = '14px'; div.style.fontFamily = 'monospace';
      div.innerHTML = '<strong>System Error:</strong><br>' + msg + '<br><br><small>Check console for details.</small>';
      document.body.appendChild(div);
    };
  </script>
  <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",
    "react/jsx-runtime": "https://esm.sh/react@18.2.0/jsx-runtime",
    "react-dom": "https://esm.sh/react-dom@18.2.0",
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
    "three": "https://esm.sh/three@0.160.0",
    "@react-three/fiber": "https://esm.sh/@react-three/fiber@8.15.16?external=react,react-dom,three",
    "@react-three/drei": "https://esm.sh/@react-three/drei@9.99.0?external=react,react-dom,three,@react-three/fiber",
    "peerjs": "https://esm.sh/peerjs@1.5.2?bundle-deps",
    "@react-three/rapier": "https://esm.sh/@react-three/rapier@1.3.0?external=react,react-dom,three,@react-three/fiber",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
    <div id="loading-overlay" class="init-loader">
        <div class="loader" style="margin: 0 auto 10px;"></div>
        <div>Loading 3D Engine...</div>
    </div>
  </body>
</html>
